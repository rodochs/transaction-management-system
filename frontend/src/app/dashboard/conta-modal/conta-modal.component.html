<div class="modal-backdrop">
  <div class="modal">
    <header class="modal__header">
      <h2>Nova Conta de Benefício</h2>
      <button type="button" class="modal__close" (click)="close()" [disabled]="loading()" aria-label="Fechar">
        ×
      </button>
    </header>

    <form [formGroup]="form" (ngSubmit)="submit()" class="modal__body">
      <div class="form-field">
        <label for="clienteId">Colaborador *</label>
        <select
          id="clienteId"
          formControlName="clienteId"
          [class.form-field__input--invalid]="form.controls.clienteId.invalid && form.controls.clienteId.touched"
        >
          <option [value]="0" disabled>Selecione um colaborador</option>
          <option *ngFor="let cliente of clientes()" [value]="cliente.id">
            {{ cliente.nome }} ({{ cliente.email }})
          </option>
        </select>
        <span class="form-field__error" *ngIf="form.controls.clienteId.invalid && form.controls.clienteId.touched">
          Selecione um colaborador
        </span>
      </div>

      <div class="form-field">
        <label for="beneficioId">Tipo de Benefício *</label>
        <select
          id="beneficioId"
          formControlName="beneficioId"
          [class.form-field__input--invalid]="form.controls.beneficioId.invalid && form.controls.beneficioId.touched"
        >
          <option [value]="0" disabled>Selecione um benefício</option>
          <option *ngFor="let beneficio of beneficios()" [value]="beneficio.id">
            {{ beneficio.nome }} - R$ {{ beneficio.valor | number:'1.2-2' }}
          </option>
        </select>
        <span class="form-field__error" *ngIf="form.controls.beneficioId.invalid && form.controls.beneficioId.touched">
          Selecione um tipo de benefício
        </span>
      </div>

      <div class="form-field">
        <label for="saldoInicial">Saldo Inicial (R$) *</label>
        <input
          id="saldoInicial"
          type="number"
          step="0.01"
          min="0"
          formControlName="saldoInicial"
          placeholder="0,00"
          [class.form-field__input--invalid]="form.controls.saldoInicial.invalid && form.controls.saldoInicial.touched"
        />
        <span class="form-field__error" *ngIf="form.controls.saldoInicial.invalid && form.controls.saldoInicial.touched">
          Saldo inicial deve ser maior ou igual a zero
        </span>
      </div>

      <p class="modal__message modal__message--error" *ngIf="error()">{{ error() }}</p>

      <footer class="modal__footer">
        <button type="button" class="button button--secondary" (click)="close()" [disabled]="loading()">
          Cancelar
        </button>
        <button type="submit" class="button button--primary" [disabled]="loading() || loadingData() || form.invalid">
          {{ loading() ? 'Criando...' : 'Criar Conta' }}
        </button>
      </footer>
    </form>
  </div>
</div>
