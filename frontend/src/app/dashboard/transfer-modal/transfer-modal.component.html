<div class="modal-backdrop">
  <div class="modal">
    <header class="modal__header">
      <h2>Nova transferência</h2>
      <button type="button" class="modal__close" (click)="close()" [disabled]="loading()">
        ×
      </button>
    </header>

    <form [formGroup]="form" (ngSubmit)="submit()" class="modal__body">
      <div class="form-field">
        <label for="fromAccountId">Conta de origem (ID)</label>
        <input
          id="fromAccountId"
          type="number"
          formControlName="fromAccountId"
          [class.form-field__input--invalid]="form.controls.fromAccountId.invalid && form.controls.fromAccountId.touched"
        />
      </div>

      <div class="form-field">
        <label for="toAccountId">Conta de destino (ID)</label>
        <input
          id="toAccountId"
          type="number"
          formControlName="toAccountId"
          [class.form-field__input--invalid]="form.controls.toAccountId.invalid && form.controls.toAccountId.touched"
        />
      </div>

      <div class="form-field">
        <label for="amount">Valor</label>
        <input
          id="amount"
          type="number"
          step="0.01"
          formControlName="amount"
          [class.form-field__input--invalid]="form.controls.amount.invalid && form.controls.amount.touched"
        />
      </div>

      <p class="modal__message modal__message--error" *ngIf="error()">{{ error() }}</p>
      <p class="modal__message modal__message--success" *ngIf="success()">{{ success() }}</p>

      <footer class="modal__footer">
        <button type="button" class="button button--secondary" (click)="close()" [disabled]="loading()">
          Cancelar
        </button>
        <button type="submit" class="button button--primary" [disabled]="loading()">
          {{ loading() ? 'Enviando...' : 'Confirmar transferência' }}
        </button>
      </footer>
    </form>
  </div>
</div>
