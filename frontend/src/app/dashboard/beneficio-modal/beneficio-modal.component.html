<div class="modal-backdrop">
  <div class="modal">
    <header class="modal__header">
      <h2>{{ isEditing ? 'Editar Benefício' : 'Novo Benefício' }}</h2>
      <button type="button" class="modal__close" (click)="close()" [disabled]="loading()" aria-label="Fechar">
        ×
      </button>
    </header>

    <form [formGroup]="form" (ngSubmit)="submit()" class="modal__body">
      <div class="form-field">
        <label for="nome">Nome do Benefício *</label>
        <input
          id="nome"
          type="text"
          formControlName="nome"
          placeholder="Ex: Vale Alimentação"
          [class.form-field__input--invalid]="form.controls.nome.invalid && form.controls.nome.touched"
        />
        <span class="form-field__error" *ngIf="form.controls.nome.invalid && form.controls.nome.touched">
          Nome é obrigatório (mínimo 3 caracteres)
        </span>
      </div>

      <div class="form-field">
        <label for="descricao">Descrição</label>
        <input
          id="descricao"
          type="text"
          formControlName="descricao"
          placeholder="Descrição do benefício"
        />
      </div>

      <div class="form-field">
        <label for="valor">Valor Padrão (R$) *</label>
        <input
          id="valor"
          type="number"
          step="0.01"
          min="0"
          formControlName="valor"
          [class.form-field__input--invalid]="form.controls.valor.invalid && form.controls.valor.touched"
        />
        <span class="form-field__error" *ngIf="form.controls.valor.invalid && form.controls.valor.touched">
          Valor deve ser maior ou igual a zero
        </span>
      </div>

      <div class="form-field form-field--checkbox">
        <label>
          <input type="checkbox" formControlName="ativo" />
          Benefício ativo
        </label>
      </div>

      <p class="modal__message modal__message--error" *ngIf="error()">{{ error() }}</p>

      <footer class="modal__footer">
        <button type="button" class="button button--secondary" (click)="close()" [disabled]="loading()">
          Cancelar
        </button>
        <button type="submit" class="button button--primary" [disabled]="loading() || form.invalid">
          {{ loading() ? 'Salvando...' : (isEditing ? 'Salvar Alterações' : 'Criar Benefício') }}
        </button>
      </footer>
    </form>
  </div>
</div>
