# Configurações para ambiente Docker com PostgreSQL

# Datasource PostgreSQL
spring.datasource.url=jdbc:postgresql://postgres:5432/beneficio_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Não usar scripts SQL automáticos (banco já inicializado pelo container)
spring.sql.init.mode=never

# Actuator para health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Logging
logging.level.com.transaction.beneficio=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
