# Ambiente de desenvolvimento com H2 (sem PostgreSQL)
services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.dev
    container_name: tms-backend-dev
    environment:
      SPRING_PROFILES_ACTIVE: default
    volumes:
      - ./backend-module/src:/app/backend-module/src:ro
      - ./ejb-module/src:/app/ejb-module/src:ro
    ports:
      - "8080:8080"
    networks:
      - tms-network

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile.dev
    container_name: tms-frontend-dev
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/angular.json:/app/angular.json:ro
      - ./frontend/tsconfig.json:/app/tsconfig.json:ro
      - ./frontend/tsconfig.app.json:/app/tsconfig.app.json:ro
    ports:
      - "4200:4200"
    networks:
      - tms-network

networks:
  tms-network:
    driver: bridge
